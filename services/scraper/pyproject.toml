[project]
name = "jobpulse-scraper"
version = "0.1.0"
description = "JobPulse Irish job opportunity discovery and monitoring service"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pydantic>=2.10.0",
    "pypdf==6.19.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "supabase>=2.30.0",
    "torch>=2.0.0",
]

[dependency-groups]
pilot = ["scrapy>=2.14,<3"]
dev = [
    {include-group = "pilot"},
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/jobpulse_scraper/database/models.py"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tools", "tests", "app.py"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
jobpulse-scraper = "jobpulse_scraper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobpulse_scraper" = ["py.typed"]
"jobpulse_scraper.config" = ["*.yaml", "*.json"]
