[project]
name = "jobpulse-scraper"
version = "0.1.0"
description = "JobPulse Irish job opportunity discovery and monitoring service"
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "sentence-transformers>=3.0.0",
    "supabase>=2.30.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["database/models.py"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"database/models.py" = ["ALL"]
"services/scraper/database/models.py" = ["ALL"]
"models.py" = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
